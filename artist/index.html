<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#0b0c0f">

  <title>
    Artist — Jewish Music Timeline
  </title>

  <link
    rel="stylesheet"
    href="/styles.css?v=1787514992">

  <link
    rel="stylesheet"
    href="/artist/artist.css?v=1787510922">

</head>


<body>

<header class="site-header">

  <div class="header-inner">

    <a
      class="brand"
      href="/">

      <span class="brand-mark">
        ♪
      </span>

      <span>

        <strong>
          Jewish Music Timeline
        </strong>

        <small>
          Artist Discography
        </small>

      </span>

    </a>

  </div>

</header>


<main class="artist-page">

  <section class="artist-hero">

    <div class="view-toggle">

      <a
        class="view-tab"
        href="/">
        Month
      </a>

      <a
        class="view-tab"
        href="/year.html">
        Year
      </a>

      <a
        class="view-tab"
        href="/search/">
        Search
      </a>

    </div>


    <a
      class="back-search"
      href="/search/">
      ‹ Back to search
    </a>


    <h1
      id="artistName"
      dir="auto">
      Loading…
    </h1>


    <div
      id="artistStats"
      class="artist-stats">
    </div>

    <button
      id="shareArtist"
      class="artist-share-button"
      type="button"
      hidden>

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <circle cx="18" cy="5" r="2.5"></circle>
        <circle cx="6" cy="12" r="2.5"></circle>
        <circle cx="18" cy="19" r="2.5"></circle>

        <path
          d="M8.2 10.8l7.5-4.4M8.2 13.2l7.5 4.4">
        </path>

      </svg>

      Share

    </button>

  </section>


  <div
    id="discographySections">
  </div>


  <section
    id="emptyState"
    class="artist-empty"
    hidden>

    <div class="artist-empty-icon">
      ♪
    </div>

    <h2>
      Artist not found
    </h2>

    <p>
      This artist does not currently
      appear in the timeline.
    </p>

  </section>

</main>


<dialog
  id="releaseDialog"
  class="release-dialog">

      <div class="dialog-top-actions">

<button
    id="dialogShare"
    class="dialog-share"
    type="button"
    aria-label="Share release"
    title="Share">

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true">

      <circle cx="18" cy="5" r="2.5"></circle>
      <circle cx="6" cy="12" r="2.5"></circle>
      <circle cx="18" cy="19" r="2.5"></circle>

      <path
        d="M8.2 10.8l7.5-4.4M8.2 13.2l7.5 4.4">
      </path>

    </svg>

  </button>

<button
    id="dialogClose"
    class="dialog-close"
    aria-label="Close">
    ×
  </button>

  </div>

  <div id="dialogContent"></div>

</dialog>


<script src="/share.js?v=1787514992"></script>
<script src="/artist/artist.js?v=1787514852"></script>

</body>
</html>
